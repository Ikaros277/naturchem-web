backend:
  name: github
  repo: Ikaros277/naturchem-web
  branch: main
  base_url: https://www.naturchem.cz
  auth_endpoint: api/decap/auth

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "poradna"
    label: "Poradna"
    folder: "content/articles"
    create: true
    extension: md
    format: frontmatter
    slug: "{{fields.slug}}"
    summary: "{{publishedAt}} — {{status}} — {{title}}"
    sortable_fields:
      - { field: publishedAt, default_sort: desc }
      - title
      - status
      - updatedAt
      - author
    fields:
      - {
          label: "Nadpis",
          name: "title",
          widget: "string",
          pattern: ["^.{1,50}$", "Napište úplný výstižný nadpis do 50 znaků."],
          hint: "Hlavní téma dejte na začátek. Nadpis se používá na webu i ve vyhledávání. Google může znění změnit nebo zkrátit podle zařízení a dotazu."
        }
      - {
          label: "Slug (URL, bez diakritiky)",
          name: "slug",
          widget: "string",
          hint: "Musí odpovídat názvu souboru, např. novela-zakona-o-ochrane-ovzdusi-2025",
          pattern: ["^[a-z0-9]+(?:-[a-z0-9]+)*$", "Malá písmena, číslice a pomlčky."]
        }
      - { label: "Perex", name: "excerpt", widget: "text" }
      - { label: "Autor", name: "author", widget: "string", default: "NATURCHEM" }
      - {
          label: "Stav publikace",
          name: "status",
          widget: "select",
          options:
            [
              { label: "Schválený — zveřejnit podle data", value: "published" },
              { label: "Koncept (skrytý na webu)", value: "draft" }
            ],
          default: "published",
          hint: "Koncept = článek se na webu neukáže, i když dáte Publish. Pro odložení nechte „Publikovat“ a níže nastavte budoucí datum."
        }
      - {
          label: "Datum publikace (i odložené)",
          name: "publishedAt",
          widget: "datetime",
          format: "YYYY-MM-DD",
          date_format: "YYYY-MM-DD",
          time_format: false,
          picker_utc: false,
          hint: "Koncept zůstává skrytý bez ohledu na datum. Budoucí datum u schváleného článku vyžaduje aktivní plánované nasazení. Dnešní nebo minulé datum = zveřejnění po nasazení. Ukládejte jen YYYY-MM-DD."
        }
      - {
          label: "Datum aktualizace",
          name: "updatedAt",
          widget: "datetime",
          format: "YYYY-MM-DD",
          date_format: "YYYY-MM-DD",
          time_format: false,
          picker_utc: false,
          required: false
        }
      - {
          label: "Téma",
          name: "topic",
          widget: "select",
          options:
            [
              "Emise",
              "Rozptylové studie",
              "Hluk",
              "Pracovní prostředí",
              "EIA a povolování",
              "Legislativa",
              "Chemická legislativa"
            ],
          required: false,
          hint: "Filtr v přehledu poradny a výchozí ikona. Pokud prázdné, odvodí se z nadpisu."
        }
      - {
          label: "Úvodní obrázek",
          name: "heroImage",
          widget: "image",
          required: false,
          hint: "Foto v hero pruhu a náhledu karty. Bez vyplnění se použije stock fotka podle tématu."
        }
      - { label: "Obsah", name: "body", widget: "markdown" }
